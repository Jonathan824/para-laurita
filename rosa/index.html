<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#080f1a">
    <title>Esta Rosa es para Tí</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,300;1,400&display=swap" rel="stylesheet">
    <style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100svh;          /* cuenta con la barra del navegador móvil */
  width: 100%;
  background: #080f1a;
  overflow-x: hidden;
  font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 48px;
  padding: 26px 18px calc(26px + env(safe-area-inset-bottom));
}

.container {
  position: relative;          /* la escena manda en el alto; el texto va debajo */
  flex: none;
}

.mensaje {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 26px;
}

/* La frase */
.frase {
  margin: 0;
  max-width: 19em;
  text-align: center;
  text-wrap: balance;
  font-style: italic;
  font-weight: 300;
  font-size: clamp(1.1rem, 5.2vw, 1.55rem);
  line-height: 1.55;
  letter-spacing: 0.015em;
  color: #f7dbe4;
  opacity: 0;
  animation: aparecer 2.6s ease 0.9s forwards,
             latido 5s ease-in-out 3.5s infinite;
}

@keyframes aparecer {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 0.85; transform: translateY(0); text-shadow: 0 0 16px rgba(245, 148, 184, 0.35); }
}
@keyframes latido {
  0%, 100% { opacity: 0.78; text-shadow: 0 0 14px rgba(245, 148, 184, 0.3); }
  50%      { opacity: 1;    text-shadow: 0 0 28px rgba(245, 148, 184, 0.6); }
}

/* Pantallas bajas: la campana se encoge para que la frase no quede fuera */
@media (max-height: 640px) {
  body { gap: 34px; }
  .container { transform: scale(0.88); transform-origin: top center; margin-bottom: -42px; }
  .frase { font-size: clamp(1rem, 4.6vw, 1.3rem); }
}

.glass {
  height: 350px;
  width: 200px;
  background: #122139;
  border-radius: 300px 300px 0px 0px;
}
.glass:before {
  content: "";
  height: 10px;
  width: 10px;
  transform-origin: center;
  border: 10px solid #122139;
  border-radius: 100%;
  position: absolute;
  left: 87px;
  top: -25px;
}
.glass:after {
  content: "";
  position: absolute;
  height: 15px;
  width: 250px;
  background: #a52a2a;
  top: 100%;
  left: -13%;
}

.shine {
  width: 12px;
  height: 140px;
  background: white;
  opacity: 0.2;
  position: absolute;
  left: 85%;
  top: 80px;
  border-radius: 100px;
  z-index: 10;
}
.shine:before {
  content: "";
  width: 12px;
  height: 20px;
  position: absolute;
  background: white;
  top: 160px;
  border-radius: 100px;
}

.petals > div {
  position: absolute;
  background: #d52d58;
  width: 45px;
  height: 80px;
  top: 55px;
  transition: all 0.5s ease-out;
}
/* El corazón de la rosa: no cae nunca */
.petals .core {
  border-radius: 15px;
  box-shadow: 0px 0px 30px #f594b8;
  left: 80px;
  top: 60px;
  background: #d52d58;
}
.petals .left {
  background: #b81b43;
  left: 60px;
  border-radius: 0px 30px 0px 30px;
  transform-origin: bottom right;
}
.petals .right {
  background: #b81b43;
  left: 100px;
  border-radius: 30px 0px 30px 0px;
  transform-origin: bottom left;
}
/* n0 = el de delante (el próximo en caer), n2 = el del fondo */
.petals .n0 {
  background: #ab1a3f;
  top: 75px;
  height: 70px;
  box-shadow: 0px 0px 50px rgba(245, 148, 184, 0.5);
}
.petals .n1 {
  background: #b81b43;
  top: 70px;
  height: 75px;
  box-shadow: 0px 0px 50px rgba(245, 148, 184, 0.5);
}
.petals .n2 {
  background: #c9204b;
  top: 65px;
  height: 70px;
  box-shadow: 0px 0px 50px rgba(245, 148, 184, 0.3);
}
.petals .glow {
  animation: glowing 2.5s ease-in-out infinite;
}
/* Mientras un pétalo avanza de puesto se mueve más despacio */
.petals .mover {
  transition: all 1.2s ease-in-out;
}
/* Un pétalo recién nacido asoma desde el fondo */
.petals .naciendo {
  opacity: 0;
}

.deadPetals > div {
  position: absolute;
  background: #d52d58;
  width: 20px;
  height: 15px;
  top: 120px;
  border-radius: 0px 30px 0px 30px;
  box-shadow: 0px 0px 30px rgba(245, 148, 184, 0.5);
  transition: all 0.5s ease-out;
}
.deadPetals > div:nth-child(1) {
  left: 67px;
  transform: rotate(-30deg);
  animation: falling 20s 4s ease-in-out infinite;
}
.deadPetals > div:nth-child(2) {
  left: 104px;
  transform: rotate(-30deg);
  animation: falling 20s 8s ease-in-out infinite;
}
.deadPetals > div:nth-child(3) {
  left: 91px;
  transform: rotate(-30deg);
  animation: falling 20s 12s ease-in-out infinite;
}
.deadPetals > div:nth-child(4) {
  left: 69px;
  transform: rotate(-30deg);
  animation: falling 20s 16s ease-in-out infinite;
}

.leaves > div:nth-last-child(1) {
  position: absolute;
  width: 55px;
  height: 30px;
  background: #338f37;
  top: 120px;
  left: 75px;
  border-radius: 100px;
}
.leaves > div:nth-child(1) {
  position: absolute;
  width: 6px;
  height: 210px;
  background: #054c05;
  top: 95px;
  left: 100px;
  border-radius: 0 0 100px 100px;
}
.leaves > div:nth-child(2) {
  position: absolute;
  width: 30px;
  height: 50px;
  top: 53px;
  border-radius: 5px 40px 20px 40px;
  background: #054c05;
  transform-origin: bottom;
  transform: rotate(-30deg);
  top: 180px;
  left: 80px;
  box-shadow: inset 5px 5px #066406;
}
.leaves > div:nth-child(3) {
  position: absolute;
  width: 30px;
  height: 50px;
  top: 53px;
  border-radius: 40px 5px 40px 20px;
  background: #054c05;
  transform-origin: bottom;
  transform: rotate(30deg);
  top: 150px;
  left: 95px;
  box-shadow: inset -5px 5px #066406;
}

.thorns > div {
  position: absolute;
  width: 0;
  height: 0;
  top: 140px;
}
.thorns > div:nth-child(odd) {
  border-top: 5px solid transparent;
  border-bottom: 5px solid transparent;
  border-left: 5px solid #054c05;
  left: 105px;
}
.thorns > div:nth-child(even) {
  border-top: 5px solid transparent;
  border-bottom: 5px solid transparent;
  border-right: 5px solid #054c05;
  left: 95px;
}
.thorns > div:nth-child(1) {
  top: 200px;
}
.thorns > div:nth-child(2) {
  top: 170px;
}
.thorns > div:nth-child(4) {
  top: 230px;
}

@keyframes glowing {
  50% {
    background: #d7365f;
    box-shadow: 0px 0px 60px #f594b8;
  }
}
@keyframes falling {
  20% {
    top: 335px;
    background: #9d193b;
    box-shadow: 0px 0px 0px rgba(245, 148, 184, 0);
  }
  100% {
    top: 335px;
    opacity: 0;
  }
}

/* --- El botón que abre la carta ------------------------------------- */
.abreme {
    font-family: inherit;
    font-size: clamp(1.05rem, 4.8vw, 1.3rem);
    font-style: italic;
    letter-spacing: 0.07em;
    color: #fff1f6;
    padding: 12px 34px;
    border: 1px solid rgba(245, 148, 184, 0.5);
    border-radius: 50px;
    background: rgba(213, 45, 88, 0.24);
    backdrop-filter: blur(8px);
    cursor: pointer;
    box-shadow: 0 0 22px rgba(245, 148, 184, 0.28);
    transition: .35s;
    animation: pulso 2.5s ease-in-out infinite;   /* late igual que la rosa */
}
.abreme:hover {
    transform: scale(1.06);
    background: rgba(213, 45, 88, 0.42);
    box-shadow: 0 0 34px rgba(245, 148, 184, 0.45);
}
.abreme:active { transform: scale(.95); }

@keyframes pulso {
    50% { box-shadow: 0 0 34px rgba(245, 148, 184, 0.5); border-color: rgba(245, 148, 184, 0.75); }
}

/* --- La carta -------------------------------------------------------- */
.carta-fondo {
    inset: 0;
    width: 100%;
    height: 100%;
    max-width: none;
    max-height: none;
    margin: 0;
    padding: 24px;
    border: none;
    background: transparent;
    overflow: hidden;
    align-items: center;
    justify-content: center;
}
.carta-fondo[open] { display: flex; }
.carta-fondo::backdrop {
    background: rgba(6, 11, 20, 0.86);
    backdrop-filter: blur(7px);
}

.carta {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 21em;
    padding: 30px 26px 26px;
    text-align: center;
    border: 1px solid rgba(245, 148, 184, 0.35);
    border-radius: 26px;
    background: linear-gradient(160deg, #17273f 0%, #0f1c31 100%);
    box-shadow: 0 0 60px rgba(213, 45, 88, 0.35),
                inset 0 0 40px rgba(245, 148, 184, 0.06);
    animation: abrirCarta .5s cubic-bezier(.2, .8, .3, 1);
}

@keyframes abrirCarta {
    from { opacity: 0; transform: scale(.88) translateY(14px); }
    to   { opacity: 1; transform: none; }
}

.sello svg {
    display: block;
    width: 46px;
    height: auto;
    margin: 0 auto;
    fill: #d52d58;
    filter: drop-shadow(0 0 14px rgba(245, 148, 184, 0.6));
    animation: latirSello 2.5s ease-in-out infinite;
}

@keyframes latirSello {
    50% { transform: scale(1.14); filter: drop-shadow(0 0 24px rgba(245, 148, 184, 0.85)); }
}

.carta p {
    margin: 16px 0 26px;
    font-style: italic;
    font-weight: 300;
    font-size: clamp(1.15rem, 5.4vw, 1.5rem);
    line-height: 1.55;
    color: #fff1f6;
    text-shadow: 0 0 18px rgba(245, 148, 184, 0.35);
}

.cerrar {
    font-family: inherit;
    font-size: clamp(0.95rem, 4.2vw, 1.1rem);
    font-style: italic;
    letter-spacing: 0.06em;
    color: #f7dbe4;
    padding: 9px 28px;
    border: 1px solid rgba(245, 148, 184, 0.35);
    border-radius: 50px;
    background: rgba(213, 45, 88, 0.18);
    cursor: pointer;
    transition: .3s;
}
.cerrar:hover {
    background: rgba(213, 45, 88, 0.36);
    box-shadow: 0 0 22px rgba(245, 148, 184, 0.35);
}
.cerrar:active { transform: scale(.95); }

/* Corazones que suben por detrás de la carta */
.corazones {
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    overflow: hidden;
}
.corazones svg {
    position: absolute;
    bottom: -60px;
    opacity: 0;
    animation: subir linear forwards;
}
.corazones .rosado { fill: #f594b8; filter: drop-shadow(0 0 10px rgba(245, 148, 184, 0.55)); }
.corazones .fuerte { fill: #d52d58; filter: drop-shadow(0 0 10px rgba(213, 45, 88, 0.6)); }
.corazones .negro  { fill: #070c15; filter: drop-shadow(0 0 7px rgba(245, 148, 184, 0.45)); }

@keyframes subir {
    0%   { opacity: 0;   transform: translate(0, 0) rotate(0deg) scale(.7); }
    12%  { opacity: .95; }
    70%  { opacity: .8; }
    100% { opacity: 0;   transform: translate(var(--vaiven), -105vh) rotate(var(--giro)) scale(1); }
}

</head>
<body class="con-nav">
    <!-- Barra de navegación compartida (estilos en ../nav.css) -->
    <nav class="nav-sitio nav-rosa" aria-label="Navegación">
        <a href="../">Inicio</a>

    </nav>

    <div class="container">
        <div class="glass">
            <div class="shine"></div>
        </div>
        <div class="thorns">
            <div></div>
            <div></div>
            <div></div>
            <div></div>
        </div>
        <div class="leaves">
            <div></div>
            <div></div>
            <div></div>
            <div></div>
        </div>
        <!-- Los pétalos los pone y los quita el script: el ciclo no acaba nunca -->
        <div class="petals"></div>
        <div class="deadPetals">
            <div></div>
            <div></div>
            <div></div>
            <div></div>
        </div>
    </div>

    <div class="mensaje">
        <p class="frase">“Mi amor por ti durará hasta que no queden pétalos en esta rosa”</p>
        <button class="abreme" type="button">Ábreme</button>
    </div>

    <!-- La carta: se abre encima de la rosa, sin salir de la página -->
    <dialog class="carta-fondo" id="carta" aria-labelledby="carta-texto">
        <div class="corazones" id="corazones" aria-hidden="true"></div>
        <div class="carta">
            <div class="sello" aria-hidden="true">
                <svg viewBox="0 0 32 29"><path d="M16 28.6S2 19.6 2 10.6C2 6 5.6 2.4 10 2.4c2.5 0 4.7 1.2 6 3 1.3-1.8 3.5-3 6-3 4.4 0 8 3.6 8 8.2 0 9-14 18-14 18z"/></svg>
            </div>
            <p id="carta-texto">Te invito a una cita de amor y amistad conmigo todo este fin de semana</p>
            <button class="cerrar" type="button">Cerrar</button>
        </div>
    </dialog>

<script>
/* ------------------------------------------------------------------
   La rosa eterna: siempre hay tres pétalos por lado.
   Cae el de delante, el de detrás toma su puesto y nace uno al fondo.
   Los lados se turnan: izquierda, derecha, izquierda...
------------------------------------------------------------------ */
(function () {
    const jardin  = document.querySelector('.petals');
    // Un ángulo por altura: n0 es el de delante (el que cae) y el último el del
    // fondo. Añadir o quitar valores aquí cambia cuántos pétalos tiene cada lado.
    const ANGULOS = [45, 15];
    const PAUSA   = 5000;          // ms entre una caída y la siguiente
    const CAIDA   = 9000;          // ms desde que se suelta hasta que se esfuma
    const PASO    = 1200;          // ms que tarda en avanzar de puesto

    let mandaIzquierda = true;     // de qué lado cae el próximo pétalo
    const flor = { left: [], right: [] };

    const signo   = lado => (lado === 'left' ? -1 : 1);
    const angulo  = (lado, nivel) => signo(lado) * ANGULOS[nivel];
    // El lado que manda se pinta por encima del otro en cada altura
    const capa    = (lado, nivel) => (ANGULOS.length - 1 - nivel) * 2 +
                                     ((lado === 'left') === mandaIzquierda ? 1 : 0);

    function colocar(p, lado, nivel, extra) {
        p.className = `${lado} n${nivel} glow${extra ? ' ' + extra : ''}`;
        p.style.transform = `rotate(${angulo(lado, nivel)}deg)`;
        p.style.zIndex = capa(lado, nivel);
    }

    function nacer(lado, nivel) {
        const p = document.createElement('div');
        colocar(p, lado, nivel, 'naciendo');
        jardin.appendChild(p);
        requestAnimationFrame(() => requestAnimationFrame(() => {
            p.classList.remove('naciendo');
        }));
        return p;
    }

    function caer(p, lado) {
        p.classList.remove('glow');
        p.classList.add('cayendo');
        p.style.zIndex = 8;

        const s     = signo(lado);
        const medio = lado === 'left' ? 100 : 60;    // por dónde pasa al voltear
        const suelo = lado === 'left' ? 50 : 110;    // dónde queda posado
        const apagado = { backgroundColor: '#71122a', boxShadow: '0px 0px 0px rgba(245, 148, 184, 0)' };
        const posado  = Object.assign({ transform: `rotate(${s * 60}deg)`, top: '252px', left: `${suelo}px` }, apagado);

        const anim = p.animate([
            { transform: `rotate(${s * ANGULOS[0]}deg)`, top: '75px', left: lado === 'left' ? '60px' : '100px',
              backgroundColor: '#ab1a3f', opacity: 1, offset: 0 },
            { transform: `rotate(${s * 90}deg)`, top: '200px', left: `${medio}px`, opacity: 1, offset: 0.30 },
            Object.assign({ opacity: 1, offset: 0.58 }, posado),   // toca el suelo
            Object.assign({ opacity: 1, offset: 0.80 }, posado),   // descansa ahí un rato
            Object.assign({ opacity: 0, offset: 1 }, posado)       // y se apaga
        ], { duration: CAIDA, easing: 'ease-in-out', fill: 'forwards' });

        anim.onfinish = () => p.remove();
        setTimeout(() => p.remove(), CAIDA + 800);   // por si la pestaña estuvo dormida
    }

    function soltar() {
        const lado = mandaIzquierda ? 'left' : 'right';

        caer(flor[lado].shift(), lado);                      // 1. cae el de delante
        flor[lado].push(nacer(lado, ANGULOS.length - 1));    // 2. nace uno al fondo
        mandaIzquierda = !mandaIzquierda;                    // 3. le toca al otro lado

        // Los que quedan avanzan un puesto (y se recalcula quién tapa a quién)
        ['left', 'right'].forEach(l => flor[l].forEach((p, nivel) => {
            colocar(p, l, nivel, 'mover');
            setTimeout(() => p.classList.remove('mover'), PASO + 100);
        }));
    }

    // --- La rosa se abre ---------------------------------------------------
    const corazon = document.createElement('div');
    corazon.className = 'core';
    jardin.appendChild(corazon);

    ['left', 'right'].forEach(lado => {
        for (let nivel = 0; nivel < ANGULOS.length; nivel++) {
            const p = document.createElement('div');
            colocar(p, lado, nivel);
            jardin.appendChild(p);
            flor[lado].push(p);
            p.animate([{ transform: 'rotate(0deg)' },
                       { transform: `rotate(${angulo(lado, nivel)}deg)` }],
                      { duration: 3000, easing: 'ease-in-out' });
        }
    });

    setTimeout(function ciclo() {
        soltar();
        setTimeout(ciclo, PAUSA);
    }, 4000);
})();

/* ------------------------------------------------------------------
   La carta: se abre encima de la rosa y se cierra con el botón,
   tocando fuera o con la tecla Escape.
------------------------------------------------------------------ */
(function () {
    const carta     = document.getElementById('carta');
    const corazones = document.getElementById('corazones');
    const abreme    = document.querySelector('.abreme');

    const FORMA = 'M16 28.6S2 19.6 2 10.6C2 6 5.6 2.4 10 2.4c2.5 0 4.7 1.2 6 3 ' +
                  '1.3-1.8 3.5-3 6-3 4.4 0 8 3.6 8 8.2 0 9-14 18-14 18z';
    const TONOS = ['rosado', 'negro', 'fuerte', 'negro', 'rosado', 'rosado', 'negro'];

    function sembrarCorazones(cuantos) {
        corazones.innerHTML = '';
        for (let i = 0; i < cuantos; i++) {
            const c = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            p.setAttribute('d', FORMA);
            c.appendChild(p);
            c.setAttribute('viewBox', '0 0 32 29');
            c.setAttribute('class', TONOS[i % TONOS.length]);

            const tam = 14 + Math.random() * 26;
            c.style.width          = tam + 'px';
            c.style.left           = Math.random() * 92 + '%';
            c.style.animationDuration = (7 + Math.random() * 6) + 's';
            c.style.animationDelay    = (Math.random() * 5) + 's';
            c.style.setProperty('--vaiven', (Math.random() * 90 - 45) + 'px');
            c.style.setProperty('--giro',   (Math.random() * 60 - 30) + 'deg');
            corazones.appendChild(c);
        }
    }

    function abrir() {
        sembrarCorazones(18);
        carta.showModal();              // <dialog> se encarga del foco y de Escape
    }

    function cerrar() {
        carta.close();
        corazones.innerHTML = '';       // los corazones dejan de correr
    }

    abreme.addEventListener('click', abrir);
    carta.querySelector('.cerrar').addEventListener('click', cerrar);

    // Tocar fuera de la carta también la cierra
    carta.addEventListener('click', e => { if (e.target === carta) cerrar(); });
    carta.addEventListener('close', () => { corazones.innerHTML = ''; });
})();
</script>
