<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#080f1a">
  <meta name="robots" content="noindex, nofollow">
  <title>Para Laurita</title>
  <meta name="description" content="Un pequeño rincón con sorpresas para Laura.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,300;1,400&family=Cinzel:wght@400;600&family=Noto+Sans+Runic&display=swap" rel="stylesheet">

  <style>
    /* =================================================================
       Portada · Para Laurita
       Un menú de "puertas": cada una lleva a una de las experiencias.
       Mobile-first, misma noche azul que la rosa y las runas.
       ================================================================= */
    :root {
      --bg:        #080f1a;
      --bg-glow:   #142038;
      --marfil:    #f3eadf;
      --tenue:     #9a978f;

      /* Acentos de cada puerta */
      --rosa:        #f594b8;
      --rosa-fuerte: #d52d58;
      --rosa-suave:  rgba(245, 148, 184, 0.35);
      --oro:         #c9a961;
      --oro-suave:   rgba(201, 169, 97, 0.35);

      --font-poem:  'Cormorant Garamond', Georgia, serif;
      --font-title: 'Cinzel', 'Times New Roman', serif;
      --font-runa:  'Noto Sans Runic', 'Segoe UI Symbol', serif;
      --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 20px calc(32px + env(safe-area-inset-bottom));
      position: relative;
      overflow-x: hidden;
      color: var(--marfil);
      font-family: var(--font-poem);
      -webkit-font-smoothing: antialiased;
      background:
        radial-gradient(ellipse 90% 55% at 50% -10%, var(--bg-glow), transparent 70%),
        var(--bg);
    }

    /* Estrellas sutiles, solo CSS */
    .stars {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        radial-gradient(1px 1px at 12% 22%, rgba(243,234,223,.5) 50%, transparent 51%),
        radial-gradient(1px 1px at 78% 14%, rgba(243,234,223,.4) 50%, transparent 51%),
        radial-gradient(1.5px 1.5px at 55% 8%,  rgba(245,148,184,.5) 50%, transparent 51%),
        radial-gradient(1px 1px at 30% 70%, rgba(243,234,223,.3) 50%, transparent 51%),
        radial-gradient(1px 1px at 88% 62%, rgba(243,234,223,.4) 50%, transparent 51%),
        radial-gradient(1.5px 1.5px at 65% 85%, rgba(201,169,97,.45) 50%, transparent 51%),
        radial-gradient(1px 1px at 8% 90%,  rgba(243,234,223,.3) 50%, transparent 51%),
        radial-gradient(1px 1px at 42% 45%, rgba(243,234,223,.25) 50%, transparent 51%);
      animation: twinkle 7s ease-in-out infinite;
    }

    .portada {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 40px;
    }

    /* ---------- Cabecera ---------- */
    .cabecera {
      text-align: center;
      animation: aparecer 1.4s var(--ease) both;
    }
    .saludo {
      font-family: var(--font-title);
      font-size: 0.7rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--tenue);
      margin-bottom: 16px;
    }
    .cabecera h1 {
      font-weight: 300;
      font-style: italic;
      font-size: clamp(1.7rem, 6.5vw, 2.3rem);
      line-height: 1.3;
      text-wrap: balance;
      color: var(--marfil);
    }

    /* ---------- Las puertas ---------- */
    .puertas {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }

    .puerta {
      --acento: var(--marfil);
      --acento-suave: rgba(243, 234, 223, 0.3);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 32px 22px 28px;
      text-align: center;
      text-decoration: none;
      color: var(--marfil);
      border: 1px solid var(--acento-suave);
      border-radius: 22px;
      background: linear-gradient(170deg, rgba(255,255,255,0.045), rgba(255,255,255,0.01));
      box-shadow: 0 30px 50px -36px rgba(0, 0, 0, 0.9);
      overflow: hidden;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.4s var(--ease), border-color 0.4s var(--ease), box-shadow 0.4s var(--ease);
      animation: aparecer 1.2s var(--ease) both;
    }
    /* Las puertas entran una detrás de otra */
    .puerta:nth-child(1) { animation-delay: 0.35s; }
    .puerta:nth-child(2) { animation-delay: 0.6s; }

    /* Halo de color propio de cada puerta */
    .puerta::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 70% 60% at 50% 0%, var(--acento-suave), transparent 70%);
      opacity: 0.55;
      transition: opacity 0.4s var(--ease);
      pointer-events: none;
    }
    .puerta:hover,
    .puerta:focus-visible {
      transform: translateY(-3px);
      border-color: var(--acento);
      box-shadow: 0 0 40px -10px var(--acento-suave), 0 30px 50px -36px rgba(0, 0, 0, 0.9);
      outline: none;
    }
    .puerta:hover::before,
    .puerta:focus-visible::before { opacity: 1; }
    .puerta:active { transform: scale(0.98); }

    .puerta-rosa  { --acento: var(--rosa); --acento-suave: var(--rosa-suave); }
    .puerta-runas { --acento: var(--oro);  --acento-suave: var(--oro-suave); }

    .icono {
      position: relative;
      display: grid;
      place-items: center;
      height: 64px;
      margin-bottom: 4px;
      color: var(--acento);
    }
    .puerta-rosa .icono svg {
      width: 44px;
      height: auto;
      fill: var(--rosa-fuerte);
      filter: drop-shadow(0 0 14px rgba(245, 148, 184, 0.6));
      animation: latir 2.5s ease-in-out infinite;
    }
    .puerta-runas .icono {
      font-family: var(--font-runa);
      font-size: 3.2rem;
      line-height: 1;
      text-shadow: 0 0 24px var(--oro-suave);
      animation: brillar 3.5s ease-in-out infinite;
    }

    .titulo {
      position: relative;
      font-family: var(--font-title);
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--acento);
    }
    .detalle {
      position: relative;
      font-style: italic;
      font-weight: 300;
      font-size: 1.12rem;
      line-height: 1.45;
      color: var(--tenue);
      max-width: 22ch;
    }

    /* Pie discreto */
    .pie {
      font-style: italic;
      font-size: 0.95rem;
      color: var(--tenue);
      opacity: 0.6;
      animation: aparecer 1.4s var(--ease) 1s both;
    }

    /* ---------- Animaciones ---------- */
    @keyframes aparecer {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes latir {
      50% { transform: scale(1.12); filter: drop-shadow(0 0 22px rgba(245, 148, 184, 0.85)); }
    }
    @keyframes brillar {
      50% { text-shadow: 0 0 38px rgba(201, 169, 97, 0.6); }
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.55; }
      50%      { opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }

    /* Tablet y escritorio: las puertas lado a lado */
    @media (min-width: 640px) {
      .portada { max-width: 640px; gap: 48px; }
      .puertas { grid-template-columns: 1fr 1fr; gap: 22px; }
      .puerta { padding: 40px 24px 34px; }
    }
  </style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>

  <main class="portada">
    <header class="cabecera">
      <p class="saludo">Para Laurita</p>
      <h1>Elige por dónde quieres empezar</h1>
    </header>

    <!-- Cada puerta lleva a una experiencia. Para añadir otra,
         copia un <a class="puerta"> y cambia el href, el icono y los textos. -->
    <nav class="puertas" aria-label="Experiencias">
      <a class="puerta puerta-rosa" href="rosa/">
        <span class="icono" aria-hidden="true">
          <svg viewBox="0 0 32 29"><path d="M16 28.6S2 19.6 2 10.6C2 6 5.6 2.4 10 2.4c2.5 0 4.7 1.2 6 3 1.3-1.8 3.5-3 6-3 4.4 0 8 3.6 8 8.2 0 9-14 18-14 18z"/></svg>
        </span>
        <span class="titulo">La rosa</span>
        <span class="detalle">Una flor que nunca deja de florecer</span>
      </a>

      <a class="puerta puerta-runas" href="runas/">
        <span class="icono" aria-hidden="true">ᚱ</span>
        <span class="titulo">Las runas</span>
        <span class="detalle">El sello de tus cartas</span>
      </a>
    </nav>

    <p class="pie">Hecho con cariño, para ti.</p>
  </main>
</body>
</html>
